# `cargo audit` configuration. The gate is `.github/workflows/audit.yml`.
#
# Every ignore states what makes the advisory unreachable and what would make it
# reachable again, so a reviewer can falsify the entry rather than trust it.

[advisories]
ignore = [
    # Both are quick-xml <0.41, and quick-xml reaches this workspace by exactly
    # one path:
    #
    #   citationberg -> hayagriva -> typst-library -> typst -> quillmark-typst
    #
    # Typst's CSL bibliography stack. quick-xml parses CSL *style* files, which
    # reach it only when a plate calls `#bibliography` with a `.csl` vendored in
    # the quill tree. No document content reaches an XML parser and Quillmark
    # downloads no packages (`QuillWorld` loads only `{quill}/packages/`), so the
    # attacker for both is the quill author, who already supplies the Typst code
    # that runs.
    #
    # The version is pinned by the typst 0.15 tree rather than by this
    # workspace's Cargo.toml. Drop these once typst bumps hayagriva past
    # quick-xml 0.41.
    #
    # Reachable again if: a backend parses XML from document input, or quills
    # gain remote package resolution (#1204).
    "RUSTSEC-2026-0194", # quadratic run time on duplicate attribute names
    "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation in NsReader
]

