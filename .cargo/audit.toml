# `cargo audit` configuration. The gate is `.github/workflows/audit.yml`.
#
# An entry here is a decision with an owner and a reason, not a mute. Every
# ignore states what makes it unreachable and what would make it reachable
# again, so a reviewer can falsify it rather than trust it.

[advisories]
ignore = [
    # Both are quick-xml <0.41, and quick-xml reaches this workspace by exactly
    # one path:
    #
    #   citationberg -> hayagriva -> typst-library -> typst -> quillmark-typst
    #
    # That is Typst's CSL bibliography stack. quick-xml parses CSL *style*
    # files, which reach it only when a plate calls `#bibliography` with a
    # `.csl` vendored in the quill tree. Quillmark never downloads packages
    # (`QuillWorld` loads only `{quill}/packages/`), and no document content
    # reaches an XML parser, so the attacker for both advisories is the quill
    # author, who already supplies the Typst code that runs.
    #
    # Not actionable here: the version is pinned by the typst 0.15 tree, not by
    # this workspace's Cargo.toml. Drop these when typst bumps hayagriva past
    # quick-xml 0.41.
    #
    # Reachable again if: a backend parses XML from document input, or quills
    # gain remote package resolution (#1204).
    "RUSTSEC-2026-0194", # quadratic run time on duplicate attribute names
    "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation in NsReader
]

# `unmaintained` and `unsound` stay warn-only. They are real signals and worth
# reading in the log, but neither is a defect on its own, and failing on them
# hands an unrelated upstream's maintenance status a veto over this repo's
# merges. Six are outstanding today, all transitive through typst's font and
# serialization stack.
informational_warnings = ["unmaintained", "unsound", "notice"]
