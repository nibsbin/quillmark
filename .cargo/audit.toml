# Advisories the workspace cannot act on. `cargo audit` already reports
# unmaintained/yanked crates as non-fatal warnings, so only vulnerabilities that
# are pinned out of reach belong here: each with the reason it is out of reach
# and the condition that retires the entry. Anything not listed fails CI.

[advisories]
ignore = [
    # quick-xml quadratic parse on duplicate attribute names / entity expansion.
    # Reachable only through typst: hayagriva → citationberg for citation styles,
    # and syntect → plist for theme loading. Both pin `<0.41`, so `cargo update`
    # resolves nothing; no workspace crate parses XML on its own. Drop both lines
    # once typst 0.16 lifts the pin.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
