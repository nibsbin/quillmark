[workspace]
members = [
    "crates/core",
    "crates/quillmark",
    "crates/quillmark-pdf",
    "crates/backends/typst",
    "crates/backends/pdfform",
    "crates/content",
    "crates/fixtures",
    "crates/bindings/wasm",
    "crates/fuzz",
    "crates/bindings/python",
    "crates/bindings/cli",
]
# The default members to include when running `cargo build` or `cargo test` in the workspace root.
default-members = [
    "crates/core",
    "crates/quillmark",
    "crates/quillmark-pdf",
    "crates/backends/typst",
    "crates/backends/pdfform",
    "crates/bindings/cli",
]
resolver = "2"

[workspace.package]
version = "0.112.0"
edition = "2024"
# No `rust-version`: nothing rebuilds the workspace on a floor to verify one,
# and the resolver enforces an unverified floor on consumers.
include = ["src/**", "Cargo.toml", "README*", "LICENSE*"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://borb-sh.github.io/quillmark/"

[workspace.dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde-saphyr = "~1.2"
serde_json = { version = "~1.0", features = ["preserve_order"] }
thiserror = "~2.0"
toml = "~1.1"
glob = "0.3.3"
unicode-normalization = "0.1"

# Preserves insertion order, so serialization is deterministic.
indexmap = { version = "2", features = ["serde"] }

# Char-level diff (Myers/LCS) for richtext edit deltas.
similar = "3.1"

pulldown-cmark = "0.13.0"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
# Pinned to the version the Typst toolchain (typst-pdf → krilla) already forces,
# so the workspace links a single copy of the PDF writer.
pdf-writer = "0.15.0"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"

# Intra-project dependencies
quillmark-core = { version = "0.112.0", path = "crates/core" }
quillmark-content = { version = "0.112.0", path = "crates/content" }
quillmark-pdf = { version = "0.112.0", path = "crates/quillmark-pdf" }
quillmark-typst = { version = "0.112.0", path = "crates/backends/typst" }
quillmark-pdfform = { version = "0.112.0", path = "crates/backends/pdfform" }
quillmark = { version = "0.112.0", path = "crates/quillmark" }

# WASM host seam. Target-gated in the Typst backend, unconditional in the
# binding; one pin either way.
js-sys = "0.3"
wasm-bindgen = "0.2"

tempfile = "~3.27"
proptest = "~1.11"
quillmark-fixtures = { path = "crates/fixtures" }
# PDF *reader*, test-only: reparses stamped output to assert on it. The
# production writer is `pdf-writer`; the two are not interchangeable.
lopdf = "0.44"

[profile.dev]
split-debuginfo = "unpacked" # Faster on macOS/Linux
[profile.dev.package."*"]
debug = false
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# Size, not speed: this is the published bundle.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
[profile.wasm-release.package."*"]
opt-level = "z"

# Fast-compiling WASM profile for CI / local iteration. Produces a larger,
# unoptimized binary: only correctness matters here, not size.
[profile.wasm-ci]
inherits = "dev"
opt-level = 0
lto = false
codegen-units = 16
panic = "abort"      # Required: wasm32 has no unwinding
debug = false        # Smaller artifacts, faster link
strip = "debuginfo"
incremental = false  # Matches CARGO_INCREMENTAL=0 in CI
