site_name: Quillmark
site_description: Render Markdown into typeset PDF, SVG, and PNG documents through a schema-validated format
site_url: https://quillmark.dev/
repo_url: https://github.com/borb-sh/quillmark
repo_name: borb-sh/quillmark
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Concepts: getting-started/concepts.md
  - Authoring:
      - Markdown Syntax: authoring/markdown-syntax.md
      - card-yaml Blocks: authoring/card-yaml.md
  - Quills:
      - Creating Quills: quills/creating-quills.md
      - Quill.yaml Reference: quills/quill-yaml-reference.md
      - Blueprint & Seeding: quills/blueprint.md
      - Typst Backend: quills/typst-backend.md
      - Editor Regions: quills/editor-regions.md
      - PDF Form Backend: quills/acroform-backend.md
      - Versioning: quills/versioning.md
  - Integrating:
      - Overview: integration/index.md
      - Programmatic Construction: integration/programmatic.md
      - Error Handling: integration/error-handling.md
      - Persistence: integration/persistence.md
      - Operations: integration/operations.md
      - Live Preview: integration/live-preview.md
  - CLI:
      - Reference: cli/reference.md
  - Reference:
      - Markdown Specification: reference/markdown-spec.md
      - Diagnostic Codes: reference/diagnostic-codes.md
  - Migration: migrations/index.md

# Every guide is built and reachable by URL and from the Migration overview;
# the nav carries only the overview.
not_in_nav: |
  /migrations/*.md

# Gallery sources are shown on the home page, not served as pages.
exclude_docs: |
  /assets/gallery/*.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
