name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# One release at a time per HEAD BRANCH, which is every closed PR's own branch:
# this workflow starts a run for each of them and the `if:` below is what sorts
# them out, so a group any wider than the branch puts ordinary merges in the
# release's queue. A group holds one pending run, and the arrival of a third
# cancels the second before its first step, so a shared group would let an
# unrelated merge evict a queued release, which then publishes nothing and
# notifies nobody. Per branch, a re-run of one release supersedes its own
# predecessor and nothing else reaches it. `cancel-in-progress: false` because a
# release cancelled partway through has published some crates and not others.
concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short

jobs:
  # ──────────────────────────────────────────────
  # Prepare: tag the release commit and cut a GitHub Release
  # Only runs when a release PR (release/vX.Y.Z) is merged to main.
  # ──────────────────────────────────────────────
  prepare:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      # The tag and the GitHub Release, and the whole of what either needs. A tag
      # ruleset that restricts creations has to admit github-actions[bot], or the
      # tag push below is rejected.
      contents: write
      # The CI conclusion the gate below reads, and the Docs dispatch at the end.
      actions: write
    outputs:
      version: ${{ steps.version.outputs.next }}
    steps:
      # The gate the whole workflow hangs off. Branch protection answers a
      # different question: its checks are the pull request head's, while ci.yml
      # runs again on the push to main that the merge is, and that second run is
      # the only verdict on the bytes tagged below. A job green on the head can
      # redden on the merge result.
      #
      # Any CI run at this commit counts, however it started, because the gate is
      # keyed on the SHA and nothing else. When the run that should answer is
      # missing or unusable, re-run *that run* — `gh run rerun <id>`, or "Re-run
      # all jobs" — which starts a new attempt on the same run and so keeps its
      # `head_sha`; this gate reads the attempt's conclusion on its next poll.
      # Dispatching ci.yml is not the way through: `workflow_dispatch` takes a
      # ref, and a ref that still pointed at this commit would have had no reason
      # to lose its run. Missing, unfinished at the deadline, or concluded
      # anything but success each stop the release, since a gate that passes when
      # it cannot find a conclusion is not a gate.
      - name: CI is green on the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          # An empty head_sha is an unfiltered query, which any green run in the
          # repository answers.
          if [ -z "$SHA" ]; then
            echo "::error::the merged pull request names no commit; no tag, no publish."
            exit 1
          fi

          RUNS="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100"
          DEADLINE=$(( SECONDS + 45 * 60 ))

          while true; do
            runs=$(gh api "$RUNS" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"') || runs=""

            if grep -q '^completed success ' <<< "$runs"; then
              echo "CI is green on ${SHA}:"
              grep '^completed success ' <<< "$runs"
              exit 0
            fi

            if [ -n "$runs" ] && ! grep -qv '^completed ' <<< "$runs"; then
              echo "::error::CI on ${SHA} concluded without a success; no tag, no publish."
              echo "$runs"
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::no successful CI run on ${SHA} within the wait; no tag, no publish."
              echo "${runs:-no CI run exists for this commit}"
              exit 1
            fi

            sleep 20
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The merge commit this event names rather than `main`, which is whatever
          # landed while this run queued. One commit gates, is tagged, is built and
          # is published, so the tag names the bytes.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read workspace version
        id: version
        run: |
          NEXT=$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "quillmark") | .version')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing v${NEXT}"

      - name: Tag and push
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          # Pull the section for this version out of CHANGELOG.md: everything
          # between its "## v<version>" heading and the next "## " heading.
          awk -v v="## v${VERSION}" \
            '$0 ~ "^"v {f=1; next} /^## / && f {exit} f {print}' \
            CHANGELOG.md > notes.md || true
          # Fall back to a generic note if the section is missing or made of
          # only whitespace (e.g. an RC with no curated changelog), `-s` alone
          # is true for a whitespace-only file and would publish blank notes.
          grep -q '[^[:space:]]' notes.md || echo "Release v${VERSION}" > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file notes.md \
              --latest
          fi

      # docs.yml deploys GitHub Pages on `release: published`, and a release cut
      # by GITHUB_TOKEN above raises no event that starts a workflow run.
      # `workflow_dispatch` is the one event exempt from that rule, so the deploy
      # is dispatched here, at the tag, the way release-prepare.yml dispatches
      # ci.yml for the same reason. A prerelease is skipped, as the event path is.
      #
      # Every publish job needs this one, and the tag and the Release already
      # exist by here, so a failed dispatch warns rather than taking crates.io,
      # npm and PyPI down with it. Docs.yml takes the same dispatch from the
      # Actions tab, which is the recovery.
      - name: Deploy the docs for this release
        if: ${{ !contains(steps.version.outputs.next, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.next }}
        run: |
          gh workflow run docs.yml --ref "$TAG" \
            || echo "::warning::could not dispatch Docs for ${TAG}; the site stays at the previous release until Docs is dispatched from the Actions tab."

  # ──────────────────────────────────────────────
  # Publish: Rust crates → crates.io
  # ──────────────────────────────────────────────
  publish-crates:
    needs: [prepare]
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Both checks answer a question only the tag can ask, at the last moment
      # the answer is still free: a failure here leaves a tag with no upload
      # behind it, where a failure after the first `cargo publish` leaves a
      # crates.io version that can never be replaced. Ahead of the token mint
      # because packaging seven crates takes minutes and a Trusted Publishing
      # token expires 30 minutes after issue.
      #
      # `cargo package` (verifying, unlike the `--no-verify` publish below)
      # builds every crate from its own archive, so a file the build needs but
      # `include` omits fails here instead of on docs.rs. The three
      # `publish = false` crates are excluded because `--workspace` would
      # package them too, and the wasm binding deliberately carries a
      # version-less path dep on `quillmark` (so `default-features = false` is
      # honoured), which `cargo package` rejects.
      - name: Package all publishable crates
        run: |
          cargo package --workspace --locked \
            --exclude quillmark-wasm \
            --exclude quillmark-python \
            --exclude quillmark-fixtures

      # `include` lists `LICENSE*` and `NOTICE`, which resolve against the
      # package directory, not the workspace root; each published crate carries
      # symlinks so the Apache-2.0 text and the NOTICE actually ship
      # (Apache-2.0 §4(a), §4(d)).
      - name: Every published crate ships its license text and NOTICE
        run: |
          status=0
          for crate in target/package/*.crate; do
            for legal in LICENSE NOTICE; do
              if ! tar tzf "$crate" | grep -qE "/$legal\$"; then
                echo "::error::$(basename "$crate") ships no $legal"
                status=1
              fi
            done
          done
          exit $status

      - name: Authenticate with crates.io (Trusted Publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish workspace crates
        # --workspace: bare `cargo publish` operates on default-members, which
        # exclude crates/content, the leaf every published crate depends on.
        # publish = false members (fixtures, bindings) are skipped, and cargo
        # orders the rest by dependency.
        #
        # Cargo refuses a version already on the registry, so every attempt
        # excludes the crates crates.io already holds at this version; that is
        # what lets a later attempt, or a re-run, resume a partial upload. Cargo
        # waits 60 seconds for each upload to reach the index before publishing
        # its dependents (the setting that raises it is nightly-only), and a
        # crates.io backlog outlasts that, so a failed attempt is retried after
        # a pause.
        #
        # Each published crate needs its own crates.io Trusted Publisher (this
        # repo + this workflow + the Publish environment). A crate missing one
        # 403s ("access token is not valid for crate <name>") when the ordered
        # publish reaches it, add the config on crates.io, then re-run.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -uo pipefail
          crates=$(cargo metadata --format-version=1 --no-deps --locked \
            | jq -r '.packages[] | select(.publish != []) | .name')
          [ -n "$crates" ] || exit 1

          for attempt in 1 2 3 4 5 6; do
            exclude=()
            pending=()
            for crate in $crates; do
              if curl -sf -o /dev/null \
                  -A "quillmark-release (https://github.com/${GITHUB_REPOSITORY})" \
                  "https://crates.io/api/v1/crates/${crate}/${VERSION}"; then
                exclude+=(--exclude "$crate")
              else
                pending+=("$crate")
              fi
            done

            if [ ${#pending[@]} -eq 0 ]; then
              echo "Every crate is on crates.io at ${VERSION}."
              exit 0
            fi

            echo "Attempt ${attempt}: publishing ${pending[*]}"
            if cargo publish --workspace --locked --no-verify "${exclude[@]}"; then
              exit 0
            fi
            sleep 60
          done

          echo "::error::crates still unpublished after ${attempt} attempts: ${pending[*]}"
          exit 1

  # ──────────────────────────────────────────────
  # Build: WASM → the npm tarball
  # ──────────────────────────────────────────────
  # Three jobs. No npm dependency runs where an OIDC token can be minted: every
  # Trusted Publisher here (crates.io, npm, PyPI) accepts any token from this
  # workflow in the Publish environment. None runs before the tarball is
  # uploaded, or in a job that saves a cache.
  build-wasm:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Restore WASM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache only the wasm cargo build dir, not pkg/. build-wasm.sh always
          # regenerates pkg/ (and the version-assert below refuses to publish a
          # mismatched stamp), so a partially-restored pkg/ can never ship. That
          # removes the stale-pkg hazard the `restore-keys` prefix once carried.
          # Namespaced under wasm-release- so a CI cache (wasm-ci-...) can never
          # satisfy this restore, that would publish an unoptimized bundle.
          path: target/wasm32-unknown-unknown/wasm-release
          key: wasm-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-release-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: Build WASM packages
        # --release-stamp: stamp the workspace version verbatim. This checkout
        # is the bumped release tag, so the number is truthful here, and only
        # here; every other build gets the script's default -dev.<sha> stamp.
        run: ./scripts/build-wasm.sh --release-stamp

      # A dev-stamped or stale-cached pkg/ must never reach npm: the stamp has
      # to equal the tag being released.
      - name: Assert pkg version matches the release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PKG_VERSION=$(jq -r .version pkg/package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "pkg/package.json is $PKG_VERSION, expected $VERSION, refusing to publish." >&2
            exit 1
          fi

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        run: ./scripts/wasm-sbom.sh

      # npm skips a `files` entry with no file behind it, so the packed file
      # list is checked. The tarball is what publish-wasm uploads, byte for byte.
      - name: Pack @quillmark/wasm
        working-directory: pkg
        run: |
          if ! npm pack --json | jq -e '[.[0].files[].path] as $p
            | ["sbom.cdx.json", "LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
            | all(. as $f | $p | index($f))' >/dev/null; then
            echo "pkg/ lacks the SBOM or a license text, refusing to publish." >&2
            exit 1
          fi

      - name: Upload the npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: pkg/*.tgz
          if-no-files-found: error

  # The suites run against the uploaded tarball, unpacked into pkg/ where they
  # import it from.
  test-wasm:
    needs: [prepare, build-wasm]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Download the npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist/

      - name: Unpack into pkg/
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir pkg
          tar xzf "dist/quillmark-wasm-${VERSION}.tgz" --strip-components=1 -C pkg

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install npm test dependencies
        working-directory: crates/bindings/wasm
        run: npm ci

      - name: Run WASM tests
        working-directory: crates/bindings/wasm
        run: npx vitest run

  # ──────────────────────────────────────────────
  # Publish: WASM → npm
  # ──────────────────────────────────────────────
  publish-wasm:
    needs: [prepare, test-wasm]
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      id-token: write
    steps:
      - name: Download the npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1, which a cached Node 24 on the
      # runner may predate.
      - name: Pin npm for Trusted Publishing
        run: npm install -g npm@11.19.0

      - name: Publish @quillmark/wasm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # `./` makes it a path: npm reads a bare `dist/<name>` as a GitHub repo.
          TARBALL="./dist/quillmark-wasm-${VERSION}.tgz"
          if [ ! -f "$TARBALL" ]; then
            echo "$TARBALL not found, refusing to publish:" >&2
            ls dist >&2
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            npm publish "$TARBALL" --access public --provenance --tag next
          else
            npm publish "$TARBALL" --access public --provenance
          fi

  # ──────────────────────────────────────────────
  # Publish: CLI binaries → GitHub Release assets
  # ──────────────────────────────────────────────
  # Every target links its C runtime statically: musl on Linux, +crt-static on
  # Windows, so a host without the VC++ redistributable still runs it. The
  # archive layout is the one `[package.metadata.binstall]` in the CLI's
  # Cargo.toml declares, so `cargo binstall quillmark-cli` resolves these
  # assets. The builds run dependency build scripts and so hold no write token;
  # `upload-cli` alone writes to the Release.
  build-cli:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, rustflags: -C target-feature=+crt-static }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p quillmark-cli --target ${{ matrix.target }}

      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          bin=target/${{ matrix.target }}/release/quillmark
          "$bin" --version
          "$bin" render crates/fixtures/resources/quills/usaf_memo/0.2.0 \
            --today 2026-01-01 -o smoke.pdf --quiet
          test -s smoke.pdf

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="quillmark-cli-${TARGET}-v${VERSION}"
          mkdir -p "$name" dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/quillmark.exe" "$name/"
          else
            cp "target/${TARGET}/release/quillmark" "$name/"
          fi
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md crates/bindings/cli/README.md "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "dist/$name.zip" "$name"
          else
            tar czf "dist/$name.tar.gz" "$name"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  upload-cli:
    needs: [prepare, build-cli]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist/

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # ──────────────────────────────────────────────
  # Publish: Python → PyPI
  # ──────────────────────────────────────────────
  build-python-linux:
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.10 3.11 3.12
          sccache: 'true'
          manylinux: auto
          working-directory: crates/bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/bindings/python/dist/*.whl

  build-python-windows:
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x64
          args: --release --out dist --interpreter 3.10 3.11 3.12
          sccache: 'true'
          working-directory: crates/bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-x64
          path: crates/bindings/python/dist/*.whl

  build-python-macos:
    needs: [prepare]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64
          args: --release --out dist --interpreter 3.10 3.11 3.12
          sccache: 'true'
          working-directory: crates/bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-aarch64
          path: crates/bindings/python/dist/*.whl

  build-python-sdist:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: crates/bindings/python

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: crates/bindings/python/dist/*.tar.gz

  publish-python:
    needs: [prepare, build-python-linux, build-python-windows, build-python-macos, build-python-sdist]
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
