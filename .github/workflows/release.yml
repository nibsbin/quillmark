name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short

jobs:
  # ──────────────────────────────────────────────
  # Prepare: tag the release commit and cut a GitHub Release
  # Only runs when a release PR (release/vX.Y.Z) is merged to main.
  # ──────────────────────────────────────────────
  prepare:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.next }}
    steps:
      # App token is required because the tag-creation ruleset blocks GITHUB_TOKEN.
      - name: Generate token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TAGGER_APP_ID }}
          private-key: ${{ secrets.TAGGER_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app.outputs.token }}

      - name: Read workspace version
        id: version
        run: |
          NEXT=$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "quillmark") | .version')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing v${NEXT}"

      - name: Tag and push
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          # Pull the section for this version out of CHANGELOG.md: everything
          # between its "## v<version>" heading and the next "## " heading.
          awk -v v="## v${VERSION}" \
            '$0 ~ "^"v {f=1; next} /^## / && f {exit} f {print}' \
            CHANGELOG.md > notes.md || true
          # release-prepare.yml seeds each version section with a coverage
          # cross-check comment for the merging maintainer to delete. A skipped
          # deletion rides onto main, where only a pull request removes it, so
          # the notes strip their own copy: the Release body is comment-free
          # whatever main's CHANGELOG.md holds.
          ./scripts/strip-seed-comment.sh notes.md
          # Fall back to a generic note if the section is missing or made of
          # only whitespace (e.g. an RC with no curated changelog, or every
          # curated line was the now-stripped seed comment), `-s` alone is
          # true for a whitespace-only file and would publish blank notes.
          grep -q '[^[:space:]]' notes.md || echo "Release v${VERSION}" > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          if [[ "$VERSION" == *-* ]]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file notes.md \
              --latest
          fi

  # ──────────────────────────────────────────────
  # Publish: Rust crates → crates.io
  # ──────────────────────────────────────────────
  publish-crates:
    needs: [prepare]
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Both checks answer a question only the tag can ask, at the last moment
      # the answer is still free: a failure here leaves a tag with no upload
      # behind it, where a failure after the first `cargo publish` leaves a
      # crates.io version that can never be replaced. Ahead of the token mint
      # because packaging seven crates takes minutes and a Trusted Publishing
      # token expires 30 minutes after issue.
      #
      # `cargo package` (verifying, unlike the `--no-verify` publish below)
      # builds every crate from its own archive, so a file the build needs but
      # `include` omits fails here instead of on docs.rs. The four
      # `publish = false` crates are excluded because `--workspace` would
      # package them too, and the wasm binding deliberately carries a
      # version-less path dep on `quillmark` (so `default-features = false` is
      # honoured), which `cargo package` rejects.
      - name: Package all publishable crates
        run: |
          cargo package --workspace --locked \
            --exclude quillmark-wasm \
            --exclude quillmark-python \
            --exclude quillmark-fuzz \
            --exclude quillmark-fixtures

      # `include` lists `LICENSE*`, which resolves against the package
      # directory, not the workspace root; each published crate carries a
      # symlink so the Apache-2.0 text actually ships (Apache-2.0 §4(a)).
      - name: Every published crate ships its license text
        run: |
          status=0
          for crate in target/package/*.crate; do
            if ! tar tzf "$crate" | grep -qE '/LICENSE$'; then
              echo "::error::$(basename "$crate") ships no LICENSE"
              status=1
            fi
          done
          exit $status

      - name: Authenticate with crates.io (Trusted Publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish workspace crates
        # --workspace: bare `cargo publish` operates on default-members, which
        # exclude crates/content, the leaf every published crate depends on.
        # publish = false members (fixtures, fuzz, bindings) are skipped; cargo
        # orders the rest by dependency and skips versions already on the
        # registry, so a re-run resumes a partially-uploaded release.
        #
        # Each published crate needs its own crates.io Trusted Publisher (this
        # repo + this workflow + the Publish environment). A crate missing one
        # 403s ("access token is not valid for crate <name>") when the ordered
        # publish reaches it, add the config on crates.io, then re-run.
        run: cargo publish --workspace --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  # ──────────────────────────────────────────────
  # Publish: WASM → npm
  # ──────────────────────────────────────────────
  publish-wasm:
    needs: [prepare]
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Restore WASM build cache
        uses: actions/cache@v6
        with:
          # Cache only the wasm cargo build dir, not pkg/. build-wasm.sh always
          # regenerates pkg/ (and the version-assert below refuses to publish a
          # mismatched stamp), so a partially-restored pkg/ can never ship. That
          # removes the stale-pkg hazard the `restore-keys` prefix once carried.
          # Namespaced under wasm-release- so a CI cache (wasm-ci-...) can never
          # satisfy this restore, that would publish an unoptimized bundle.
          path: target/wasm32-unknown-unknown/wasm-release
          key: wasm-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-release-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2.85.9
        with:
          tool: wasm-bindgen-cli@0.2.118

      - name: Build WASM packages
        # --release-stamp: stamp the workspace version verbatim. This checkout
        # is the bumped release tag, so the number is truthful here, and only
        # here; every other build gets the script's default -dev.<sha> stamp.
        run: ./scripts/build-wasm.sh --release-stamp

      # A dev-stamped or stale-cached pkg/ must never reach npm: the stamp has
      # to equal the tag being released.
      - name: Assert pkg version matches the release tag
        run: |
          PKG_VERSION=$(jq -r .version pkg/package.json)
          if [ "$PKG_VERSION" != "${{ needs.prepare.outputs.version }}" ]; then
            echo "pkg/package.json is $PKG_VERSION, expected ${{ needs.prepare.outputs.version }}, refusing to publish." >&2
            exit 1
          fi

      - name: Install npm test dependencies
        working-directory: crates/bindings/wasm
        run: npm install

      - name: Run WASM tests
        working-directory: crates/bindings/wasm
        run: npx vitest run

      - name: Upgrade npm for Trusted Publishers
        run: npm install -g npm@latest

      - name: Publish @quillmark/wasm
        working-directory: pkg
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

  # ──────────────────────────────────────────────
  # Publish: Python → PyPI
  # ──────────────────────────────────────────────
  build-python-linux:
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.10 3.11 3.12
          sccache: 'true'
          manylinux: auto
          working-directory: crates/bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/bindings/python/dist/*.whl

  build-python-windows:
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --interpreter 3.10 3.11 3.12
          sccache: 'true'
          working-directory: crates/bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: crates/bindings/python/dist/*.whl

  build-python-macos:
    needs: [prepare]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist --interpreter 3.10 3.11 3.12
          sccache: 'true'
          working-directory: crates/bindings/python

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-aarch64
          path: crates/bindings/python/dist/*.whl

  build-python-sdist:
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/bindings/python

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: crates/bindings/python/dist/*.tar.gz

  publish-python:
    needs: [prepare, build-python-linux, build-python-windows, build-python-macos, build-python-sdist]
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
