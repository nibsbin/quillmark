name: CI

on:
  pull_request:
  # main only. A branch push used to fire this too, so a PR branch ran the
  # whole suite twice for one commit; the PR event is the one with the merge
  # result in it, so it wins. Tags cannot match `branches`, so release tags
  # stay out on their own.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Canon spine lint (prose/README.md). Zero deps and no git history, so it
      # runs before the Rust setup and fails fast on a checkout-only step.
      - name: Check canon spine
        run: node scripts/check-canon.mjs

      # Guards scripts/strip-seed-comment.sh, which release.yml and
      # release-prepare.yml rely on to keep the release-prepare coverage comment
      # out of published Release notes and merged CHANGELOG.md. Rides along here
      # rather than in its own job: the assertions take 0s, so standing up a
      # runner for them was ~100% overhead. Runs in RUNNER_TEMP so the fixtures
      # never dirty the checkout.
      - name: Check strip-seed-comment.sh strips the comment, and is a no-op without one
        run: |
          cd "$RUNNER_TEMP"
          printf '## v1.0.0 - 2026-01-01\n\n- entry one\n\n<!-- seed: commits since v0.9.0 — confirm the entries above cover them, then delete this comment\n- commit a\n- commit b\n-->\n\n## v0.9.0 - 2025-12-01\n\n- old entry\n' > seeded.md
          printf '## v1.0.0 - 2026-01-01\n\n- entry one\n\n## v0.9.0 - 2025-12-01\n\n- old entry\n' > seeded.expected.md
          "$GITHUB_WORKSPACE/scripts/strip-seed-comment.sh" seeded.md
          diff seeded.expected.md seeded.md
          printf '## v1.0.0 - 2026-01-01\n\n- entry one\n' > clean.md
          cp clean.md clean.expected.md
          "$GITHUB_WORKSPACE/scripts/strip-seed-comment.sh" clean.md
          diff clean.expected.md clean.md

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Clippy is intentionally NOT gated here. A clippy gate was tried
      # (a11caa45), the tree made clippy-clean, then the gate removed
      # (68c3751a) as not worth the CI time; `cargo doc -Dwarnings` is the
      # standing lint gate. Do not re-add a "make clippy clean" pass expecting
      # CI to enforce it — record the policy change here first if that changes.
      - name: Build docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked

      # The step above walks default-members, which omits the binding crates —
      # crates/bindings/wasm is a wasm32 cdylib excluded from default-members —
      # so their rustdoc, intra-doc links included, is never linted by it. That
      # blind spot let two broken `Delta` links accumulate on the JS surface
      # (#1034). quillmark-wasm also carries an rlib target, so it documents on
      # the host toolchain; lint it explicitly to catch such breakage going
      # forward. Separate step so a wasm-only doc failure is legible in the log.
      - name: Build docs (wasm binding)
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked -p quillmark-wasm

  test:
    # The CLI ships to crates.io, so the suite has to run on Windows — but on
    # merge, not on every PR push. It bills at 2x and was 53% of the entire CI
    # spend to re-run a suite that is overwhelmingly platform-blind: the tree
    # carries no `target_os`/`target_family` cfg anywhere, so the only surface
    # that can differ is path handling (tree paths are `/`-joined and resolve
    # via `Path::components()`, which takes either separator) and checkout line
    # endings (pinned in .gitattributes after they broke the snapshot test).
    # Both of those are now structural rather than a thing each PR can regress.
    #
    # The trade is real and one line to undo: a Windows-only break reaches main
    # and is caught on the merge run instead of in review. Put windows-latest in
    # the pull_request arm below if that stops being the right side of it.
    #
    # macOS is in neither arm — against Linux it differs only in being
    # case-insensitive, which is strictly more permissive, so it catches nothing
    # Linux misses. It billed at 10x for that.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push'
          && fromJSON('["ubuntu-latest", "windows-latest"]')
          || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --all-features --locked

      # --all-features forces `typst` on, so the zero-backend branch — the
      # "no backends registered" path in orchestration/engine.rs and the
      # `#[cfg(not(feature = "typst"))]` half of feature_flag_test.rs — never
      # compiles above. The WASM `core` variant has this covered by
      # build-wasm.sh + core.test.js; this is the native equivalent. Which
      # branch a feature gate selects does not vary by OS, so one runner answers
      # it.
      - name: Tests (zero-backend configuration)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p quillmark --no-default-features --locked

  # release.yml publishes with `--no-verify`, which skips building each crate
  # from its own `.crate` archive. That check has to happen somewhere it can
  # still change the outcome: a crates.io version cannot be replaced, so a file
  # the build needs but `include` omits is only fixable before the tag.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Builds every publishable crate from its packaged archive — the step
      # `cargo publish --no-verify` drops. The four `publish = false` crates are
      # excluded because `--workspace` would package them too, and the wasm
      # binding deliberately carries a version-less path dep on `quillmark`
      # (so `default-features = false` is honoured), which `cargo package`
      # rejects.
      - name: Package all publishable crates
        run: |
          cargo package --workspace --locked \
            --exclude quillmark-wasm \
            --exclude quillmark-python \
            --exclude quillmark-fuzz \
            --exclude quillmark-fixtures

      # `include` lists `LICENSE*`, which resolves against the package
      # directory, not the workspace root; each published crate carries a
      # symlink so the Apache-2.0 text actually ships (Apache-2.0 §4(a)).
      - name: Every published crate ships its license text
        run: |
          status=0
          for crate in target/package/*.crate; do
            if ! tar tzf "$crate" | grep -qE '/LICENSE$'; then
              echo "::error::$(basename "$crate") ships no LICENSE"
              status=1
            fi
          done
          exit $status

  # Holds `rust-version` in Cargo.toml to something true. Without this a
  # dependency bump can raise the real floor silently, and a consumer on a
  # pinned toolchain learns about it from a compile error deep in the tree
  # rather than from the resolver.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          MSRV=$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "quillmark") | .rust_version')
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
          echo "MSRV is $MSRV"

      - name: Setup Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check on the MSRV toolchain
        run: cargo check --workspace --all-features --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo.lock resolves 440 packages, including the Typst toolchain and a
      # hand-rolled PDF reader/writer. Nothing else watches them for advisories.
      #
      # Deliberately `cargo audit` and not rustsec/audit-check: the action fails
      # the check on warnings too, and `unmaintained`/`yanked` fire on six crates
      # Typst pins that no change here can move — a gate that is red no matter
      # what the PR does gets clicked past, which is worse than no gate. Bare
      # `cargo audit` fails on vulnerabilities and prints warnings. The two
      # vulnerabilities that are themselves pinned out of reach are listed, with
      # reasons, in .cargo/audit.toml.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies against RUSTSEC
        run: cargo audit

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify core build excludes Typst
        # `cargo tree -i` exits 0 only when quillmark-typst IS in the no-features
        # graph — i.e. a leak. The release size budget catches this too, but only
        # on release; behavioural tests never see it (a leak doesn't change the
        # API, just bloats the bundle ~12x). This is the PR-level guard.
        run: |
          if cargo tree -p quillmark-wasm --no-default-features \
               --target wasm32-unknown-unknown -i quillmark-typst >/dev/null 2>&1; then
            echo "::error::quillmark-typst leaked into the core (no-default-features) build"
            exit 1
          fi
          echo "OK: quillmark-typst absent from the core feature graph"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache WASM cargo build
        uses: actions/cache@v4
        with:
          # Cache only the wasm cargo build dir — not pkg/. build-wasm.sh always
          # regenerates pkg/ from a warm target/ (a quick incremental rebuild +
          # wasm-bindgen), so pkg/ never needs to survive across runs, no pkg
          # inputs need enumerating in the key, and no stale pkg/ can be served
          # to vitest or the typecheck drift guard. Namespaced to wasm-ci so it
          # never mixes with the release workflow's size-optimized wasm-release
          # build. Cargo's own incremental staleness handles source edits within
          # a restored target/, so the key only busts on a dependency change.
          path: target/wasm32-unknown-unknown/wasm-ci
          key: wasm-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-ci-${{ runner.os }}-

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.118

      - name: Build WASM
        run: ./scripts/build-wasm.sh --ci

      # `ci` not `install`: installs straight from package-lock.json, so the
      # lockfile cannot drift silently in CI the way `install` can rewrite it.
      - name: Install npm dependencies
        working-directory: crates/bindings/wasm
        run: npm ci

      - name: Test WASM
        working-directory: crates/bindings/wasm
        run: npx vitest run

      - name: Typecheck WASM (canonical runtime.d.ts drift guard)
        working-directory: crates/bindings/wasm
        run: npm run typecheck

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `maturin develop` builds the pyo3 extension in the DEBUG (dev) profile —
      # far faster to compile than the release build a `pip install -e` (maturin
      # PEP-517 default) would trigger, and opt-level is irrelevant to test
      # outcomes. Matches `cargo test --workspace` (also debug) and the documented
      # dev flow (CLAUDE.md / README). The top-level CARGO_PROFILE_DEV_DEBUG=0 env
      # strips debuginfo, so this stays lean.
      - name: Build extension (debug)
        working-directory: crates/bindings/python
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install pytest maturin
          maturin develop

      - name: Test Python
        working-directory: crates/bindings/python
        run: .venv/bin/pytest -q

