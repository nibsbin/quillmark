name: CI

on:
  pull_request:
  # main only: the PR event already carries the merge result, so a branch push
  # would run the whole suite twice for one commit. Tags cannot match
  # `branches`, so release tags stay out on their own.
  push:
    branches: [main]
  # On demand, for re-running the suite against a branch without a new push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

# Four jobs: the lint gate, then one per shipped surface (the Rust workspace,
# the WASM bundle, the Python wheel).
#
# A gate whose verdict matters only at the tag belongs in release.yml: packaging
# each crate from its own archive and the license-text assert run in
# `publish-crates`, the last point a failure still costs nothing.
#
# A gate reading a file the diff rarely touches earns its runner elsewhere.
# Dependabot alerts watch Cargo.lock continuously, quiet weeks included. A local
# `cargo audit` reports RUSTSEC-2026-0194 and -0195, both quick-xml <0.41,
# reached only through citationberg -> hayagriva -> typst-library, and pinned by
# that tree rather than by this workspace: not actionable here. No `rust-version`
# exists to verify.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Canon spine lint (prose/README.md). Zero deps and no git history, so it
      # runs before the Rust setup and fails fast on a checkout-only step.
      - name: Check canon spine
        run: node scripts/check-canon.mjs

      # Guards scripts/strip-seed-comment.sh, which release.yml relies on to
      # keep the release-prepare coverage comment out of published Release
      # notes, and release-prepare.yml to keep it out of a freshly seeded
      # CHANGELOG.md section. Rides here rather than in its own job: the
      # assertions take 0s, so a runner for them is pure overhead. Runs in
      # RUNNER_TEMP so the fixtures never dirty the checkout.
      - name: Check strip-seed-comment.sh strips the comment, and is a no-op without one
        run: |
          cd "$RUNNER_TEMP"
          printf '## v1.0.0 - 2026-01-01\n\n- entry one\n\n<!-- seed: commits since v0.9.0, confirm the entries above cover them, then delete this comment\n- commit a\n- commit b\n-->\n\n## v0.9.0 - 2025-12-01\n\n- old entry\n' > seeded.md
          printf '## v1.0.0 - 2026-01-01\n\n- entry one\n\n## v0.9.0 - 2025-12-01\n\n- old entry\n' > seeded.expected.md
          "$GITHUB_WORKSPACE/scripts/strip-seed-comment.sh" seeded.md
          diff seeded.expected.md seeded.md
          printf '## v1.0.0 - 2026-01-01\n\n- entry one\n' > clean.md
          cp clean.md clean.expected.md
          "$GITHUB_WORKSPACE/scripts/strip-seed-comment.sh" clean.md
          diff clean.expected.md clean.md

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Clippy is not gated: `cargo doc -Dwarnings` is the standing lint gate. A
      # clippy gate (a11caa45) bought a clippy-clean tree for more CI time than
      # it was worth (68c3751a). Do not re-add a "make clippy clean" pass
      # expecting CI to enforce it; record the policy change here first.
      #
      # `--workspace`, not a bare `cargo doc`: bare walks default-members, and
      # a crate outside it is never linted, the blind spot that let two broken
      # `Delta` links accumulate on the JS surface (#1034) and four more in
      # quillmark-content, which is published, so its rustdoc is what docs.rs
      # serves. Every member documents on the host toolchain, the wasm32
      # cdylib included (it carries an rlib target too), so this needs no
      # `--exclude` and a crate added outside default-members is covered the
      # day it lands.
      - name: Build docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --no-deps --locked --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # `cargo test` builds each cdylib's rlib for the harness and stops there,
      # so nothing links `quillmark_wasm`, `_quillmark`, or the `quillmark` bin
      # on the host. `--all-targets` links every artifact the workspace ships
      # and compiles the four examples, which no test target reaches.
      - name: Build every target
        run: cargo build --workspace --all-targets --locked

      # Doctests ride along here: `cargo test` runs them by default, 3 across
      # the workspace with 2 more `ignore`d.
      - name: Tests
        run: cargo test --workspace --all-features --locked

      # --all-features forces `typst` on, so the zero-backend branch, the
      # "no backends registered" path in orchestration/engine.rs and the
      # `#[cfg(not(feature = "typst"))]` half of feature_flag_test.rs, never
      # compiles above. The WASM `core` variant has this covered by
      # build-wasm.sh + core.test.js; this is the native equivalent.
      - name: Tests (zero-backend configuration)
        run: cargo test -p quillmark --no-default-features --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify core build excludes Typst
        # `cargo tree -i` exits 0 only when quillmark-typst IS in the no-features
        # graph; i.e. a leak. The release size budget catches this too, but only
        # on release; behavioural tests never see it (a leak doesn't change the
        # API, just bloats the bundle ~12x). This is the PR-level guard.
        run: |
          if cargo tree -p quillmark-wasm --no-default-features \
               --target wasm32-unknown-unknown -i quillmark-typst >/dev/null 2>&1; then
            echo "::error::quillmark-typst leaked into the core (no-default-features) build"
            exit 1
          fi
          echo "OK: quillmark-typst absent from the core feature graph"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache WASM cargo build
        uses: actions/cache@v6
        with:
          # Cache only the wasm cargo build dir, not pkg/. build-wasm.sh always
          # regenerates pkg/ from a warm target/ (a quick incremental rebuild +
          # wasm-bindgen), so pkg/ never needs to survive across runs, no pkg
          # inputs need enumerating in the key, and no stale pkg/ can be served
          # to vitest or the typecheck drift guard. Namespaced to wasm-ci so it
          # never mixes with the release workflow's size-optimized wasm-release
          # build. Cargo's own incremental staleness handles source edits within
          # a restored target/, so the key only busts on a dependency change.
          path: target/wasm32-unknown-unknown/wasm-ci
          key: wasm-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-ci-${{ runner.os }}-

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2.87.2
        with:
          tool: wasm-bindgen-cli@0.2.118

      - name: Build WASM
        run: ./scripts/build-wasm.sh --ci

      # `install`, not `ci`: package-lock.json is gitignored (.gitignore:45), so
      # a fresh checkout has no lockfile for `ci` to install from.
      - name: Install npm dependencies
        working-directory: crates/bindings/wasm
        run: npm install

      - name: Test WASM
        working-directory: crates/bindings/wasm
        run: npx vitest run

      - name: Typecheck WASM (canonical runtime.d.ts drift guard)
        working-directory: crates/bindings/wasm
        run: npm run typecheck

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `maturin develop` builds the pyo3 extension in the DEBUG (dev) profile,
      # far faster to compile than the release build a `pip install -e` (maturin
      # PEP-517 default) would trigger, and opt-level is irrelevant to test
      # outcomes. Matches `cargo test --workspace` (also debug) and the documented
      # dev flow (CLAUDE.md / README). The top-level CARGO_PROFILE_DEV_DEBUG=0 env
      # strips debuginfo, so this stays lean.
      - name: Build extension (debug)
        working-directory: crates/bindings/python
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install pytest maturin
          maturin develop

      - name: Test Python
        working-directory: crates/bindings/python
        run: .venv/bin/pytest -q
