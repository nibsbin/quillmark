version: 2

# Grouped so a routine bump week is one PR per ecosystem, not thirty. Security
# updates are ungrouped by design; they arrive on their own so they can be
# reviewed and merged without waiting on unrelated bumps.
#
# A version is proposed once it is a week old, so a compromised release has
# time to be caught and pulled first. Security updates skip the cooldown.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]

  # The WASM binding's npm side: the test runner, the typecheck, the packaging.
  - package-ecosystem: npm
    directory: /crates/bindings/wasm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
