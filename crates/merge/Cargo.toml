[package]
name = "quillmark-merge"
version.workspace = true
edition.workspace = true
license.workspace = true
include.workspace = true
readme = "README.md"
description = "Bulk document generation for Quillmark: a merge spec interpreted over rows into documents, with a per-row report"
documentation = "https://docs.rs/quillmark-merge"
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
keywords = ["markdown", "pdf", "mail-merge", "template", "csv"]
categories = ["text-processing"]
publish = true

[dependencies]
indexmap = { workspace = true }
quillmark-core = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }

[dev-dependencies]
quillmark = { workspace = true }
quillmark-fixtures = { workspace = true }
