[package]
name = "quillmark-pdf"
version.workspace = true
edition.workspace = true
include = ["src/**", "Cargo.toml", "README*", "LICENSE*", "NOTICE"]
readme.workspace = true
description = "Typst-free AcroForm stamping spine for Quillmark: (base_pdf, &[FieldSpec]) -> stamped PDF + regions"
license.workspace = true
documentation = "https://docs.rs/quillmark-pdf"
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
publish = true

[dependencies]
quillmark-core = { workspace = true }
pdf-writer = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lopdf = { workspace = true }
proptest = { workspace = true }
quillmark-fixtures = { workspace = true }
