quill:
  name: roster_form
  version: 0.1.0
  backend: typst
  description: Exercises an open matrix vocabulary, a capped array, and a table-layout typed table

typst:
  plate_file: plate.typ

main:
  body:
    enabled: false
  fields:
    title:
      type: text
      default: Annual Roster

    qualifications:
      type: matrix
      open: true
      description: Tick each qualification held; annotate a tick with the date earned, and add one the roster lacks.
      members:
        sq_cc_candidate: Sq/CC Candidate
        flight_cc: Flight CC
        dodin_ops: DODIN Ops
        dco: DCO (Defensive)
        cyber_200: Cyber 200
      properties:
        detail:
          type: text
          default: ""
          description: What the tick is qualified by.

    endorsements:
      type: array
      max: 3
      description: Endorsing officials, in routing order.
      items:
        type: text

    tours:
      type: array
      max: 2
      description: Assignments, newest first.
      ui:
        layout: table
      items:
        type: object
        properties:
          unit:
            type: text
            default: ""
          duration:
            type: integer
            default: 0
