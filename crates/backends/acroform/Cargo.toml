[package]
name = "quillmark-acroform"
version.workspace = true
edition.workspace = true
include = ["src/**", "Cargo.toml", "README*", "LICENSE*"]
readme.workspace = true
description = "Typst-free PDF-form backend for Quillmark: fills existing PDF forms via the quillmark-pdf stamping spine"
license.workspace = true
documentation = "https://docs.rs/quillmark-acroform"
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
keywords = ["pdf", "acroform", "forms", "form-filling"]
categories = ["rendering"]
publish = true

[dependencies]
quillmark-core = { workspace = true }
quillmark-pdf = { workspace = true }
# Lower a richtext field's content JSON to plaintext (`Content.text` minus island
# slots) for a form-field value; no markdown parser is linked.
quillmark-content = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The raster behind the canvas paint seam (`render_rgba`), over the stamped PDF.
# Always linked: canvas paint is unconditional, so the raster tree is not
# feature-gated. (The no-features WASM `core` build excludes the whole acroform
# crate, so hayro never reaches it.)
hayro = "0.7.1"

[dev-dependencies]
quillmark-fixtures = { workspace = true }
# Path-only: `quillmark` depends on this crate, so a versioned dev-dep here is
# an unpublishable cycle; cargo strips path-only dev-deps at packaging.
quillmark = { path = "../../quillmark" }
lopdf = { workspace = true }
