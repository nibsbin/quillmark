[package]
name = "quillmark-typst"
version.workspace = true
edition.workspace = true
include = ["src/**", "Cargo.toml", "README*", "LICENSE*", "NOTICE"]
readme.workspace = true
description = "Typst backend for Quillmark"
license.workspace = true
documentation = "https://docs.rs/quillmark-typst"
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
publish = true

[dependencies]
# Typst's process-global memo cache; evicted after each compile (compile.rs).
comemo = "0.5"
quillmark-core = { workspace = true }
# The content model `emit.rs` lowers to Typst markup, reached directly rather
# than through core so the emitter names its types head-on. Nothing here parses
# markdown: the content crosses the seam already imported.
quillmark-content = { workspace = true }
quillmark-pdf = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
typst = { workspace = true }
typst-layout = { workspace = true }
typst-pdf = { workspace = true }
typst-render = { workspace = true }
typst-svg = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# Acceptance tests parse the injected PDF to validate AcroForm structure.
lopdf = { workspace = true }
quillmark-fixtures = { workspace = true }
# Path-only: `quillmark` depends on this crate, so a versioned dev-dep here is
# an unpublishable cycle; cargo strips path-only dev-deps at packaging. Tests
# walk fixture quills through its `tree_from_path`.
quillmark = { path = "../../quillmark" }
