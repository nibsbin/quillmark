[package]
name = "quillmark-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for Quillmark, a schema-driven document engine"
license.workspace = true
repository = "https://github.com/borb-sh/quillmark"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Direct path dep (not `workspace = true`) so `default-features = false` is
# honoured: workspace inheritance forces the default `typst` feature on, which
# would pull Typst into the core build. This crate is `publish = false`, so no
# version pin is needed. `typst` re-enables Typst via `quillmark/typst`.
quillmark = { path = "../../quillmark", default-features = false }
quillmark-core = { workspace = true }
# The content codec (importMarkdown / exportMarkdown / rebase / mapPos) and the
# change-bundle op wire live here; the addressed write surface lowers to it.
quillmark-content = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_bytes = "0.11"
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
tsify = { version = "0.5.6", features = ["js"] }
console_error_panic_hook = "0.1"
js-sys = { workspace = true }
web-sys = { version = "0.3", optional = true, features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
] }

[features]
# Two artifacts from one crate. The boundary is *which types exist*, not
# feature-gated methods inside a shared type.
default = ["render"]
# Render build: the engine, LiveSession, and canvas preview over both
# backends. Strict API superset of core; Typst is nearly all of the
# artifact. The canvas painter dispatches through the core `SessionHandle`
# seam, so the binding depends on the backend crates only transitively.
render = ["quillmark/typst", "quillmark/acroform", "dep:web-sys"]
# Core build = no features: Document + Quill (parse / load / validate / schema
# / seed / blueprint). No engine, no Typst; `scripts/build-wasm.sh` enforces its
# gzip ceiling.

[package.metadata.cargo-machete]
# serde_bytes is used via `#[serde(with = "serde_bytes")]` in src/types.rs,
# which cargo-machete cannot see.
ignored = ["serde_bytes"]
