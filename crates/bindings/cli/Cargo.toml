[package]
name = "quillmark-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for Quillmark, a schema-driven document engine"
license.workspace = true
include.workspace = true
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
keywords = ["markdown", "pdf", "typst", "template", "cli"]
categories = ["command-line-utilities", "text-processing"]
publish = true

[[bin]]
name = "quillmark"
path = "src/main.rs"
test = false
# The binary shares the `quillmark` name with the library crate; documenting it
# would collide at `target/doc/quillmark/index.html`. CLI internals don't need
# rustdoc HTML, so skip them.
doc = false

[dependencies]
clap = { version = "~4.6", features = ["derive"] }
csv = { workspace = true }
indexmap = { workspace = true }
quillmark = { workspace = true }
quillmark-core = { workspace = true }
quillmark-merge = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `quillmark-fixtures` is path-only, so cargo strips it from the published
# manifest; `include` leaves `tests/` out of the archive besides. `serde_json` is
# not repeated here: a test target sees the package's `[dependencies]` too.
[dev-dependencies]
quillmark-fixtures = { workspace = true }
tempfile = { workspace = true }

