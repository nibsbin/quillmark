[package]
name = "quillmark-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for Quillmark, a schema-driven document framework"
license.workspace = true
include.workspace = true
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
keywords = ["markdown", "pdf", "typst", "template", "cli"]
categories = ["command-line-utilities", "text-processing"]
publish = true

[[bin]]
name = "quillmark"
path = "src/main.rs"
test = false
# The binary shares the `quillmark` name with the library crate; documenting it
# would collide at `target/doc/quillmark/index.html`. CLI internals don't need
# rustdoc HTML, so skip them.
doc = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "~4.6", features = ["derive"] }
indexmap = { workspace = true }
quillmark = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["local-offset"] }

# `quillmark-fixtures` is path-only, so cargo strips it from the published
# manifest; `include` leaves `tests/` out of the archive besides.
[dev-dependencies]
quillmark-fixtures = { workspace = true }
tempfile = { workspace = true }

