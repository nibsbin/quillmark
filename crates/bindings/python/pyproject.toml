[build-system]
# >=1.9.3 puts declared `license-files` at the sdist root, where `License-File` points.
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "quillmark"
dynamic = ["version"]
description = "Python bindings for Quillmark - a schema-driven document engine"
authors = [{ name = "Quillmark Contributors" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup",
]
keywords = ["markdown", "pdf", "typst", "rendering", "templates"]

[project.urls]
Homepage = "https://borb-sh.github.io/quillmark/"
Repository = "https://github.com/borb-sh/quillmark"
Changelog = "https://github.com/borb-sh/quillmark/blob/main/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "quillmark._quillmark"
# `py.typed` and the `.pyi` are the typed surface: a wheel without them types
# as `Any` no matter what the source tree carries, so they ship explicitly.
include = [
    "python/quillmark/**/*.py",
    "python/quillmark/**/*.pyi",
    "python/quillmark/py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
