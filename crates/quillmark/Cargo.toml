[package]
name = "quillmark"
version.workspace = true
edition.workspace = true
include.workspace = true
readme.workspace = true
description = "A schema-driven document engine: turn Markdown into a fully typeset document with a Quill"
license.workspace = true
documentation = "https://docs.rs/quillmark"
homepage.workspace = true
repository = "https://github.com/borb-sh/quillmark"
publish = true

[dependencies]
quillmark-core = { workspace = true }
quillmark-typst = { workspace = true, optional = true }
quillmark-acroform = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
quillmark-typst = { workspace = true }
quillmark-acroform = { workspace = true }
quillmark-fixtures = { workspace = true }
quillmark-content = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["typst", "acroform"]
typst = ["dep:quillmark-typst"]
# The acroform backend renders forms → PDF, and paints canvas pages via its
# always-linked hayro seam, so the acroform session reports
# `supports_canvas() == true` and a canvas binding can paint acroform quills.
acroform = ["dep:quillmark-acroform"]
